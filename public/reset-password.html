<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - My Farms</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main style="max-width:640px;padding-top:3rem;">
      <section class="orders-section">
        <h2>Reset Password</h2>
        <p class="muted small">Paste token from email (or console in dev mode), then set new password.</p>
        <form id="resetForm">
          <div class="field">
            <label>Reset Token</label>
            <input id="token" required />
          </div>
          <div class="field">
            <label>New Password</label>
            <input id="newPassword" type="password" required />
          </div>
          <button class="btn-primary" type="submit">Reset Password</button>
        </form>
        <p id="msg" class="small muted"></p>
        <a href="/" class="btn-link">Back to Store</a>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const tokenInput = document.getElementById("token");
      const form = document.getElementById("resetForm");
      const msg = document.getElementById("msg");
      if (params.get("token")) tokenInput.value = params.get("token");

      form.onsubmit = async (e) => {
        e.preventDefault();
        msg.textContent = "Processing...";

        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: document.getElementById("token").value,
            newPassword: document.getElementById("newPassword").value
          })
        });

        const data = await res.json().catch(() => ({}));
        msg.textContent = res.ok ? "Password reset successful. Go back and login." : data.error || "Failed";
      };
    </script>
  </body>
</html>
